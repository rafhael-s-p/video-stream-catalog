rest-client:
  categories:
    base-url: "${rest-client.base-url}/api/categories"

kafka:
  auto-create-topics: false
  bootstrap-servers: localhost:9092
  pool-timeout: 1_000
  consumers:
    categories:
      auto-offset-reset: earliest
      concurrency: 1
      id: kafka-listener-categories
      topics: adm_videos_mysql.adm_videos.categories
      group-id: catalog-service

elasticsearch:
  connect-timeout: 250
  socket-timeout: 1_000

graphql:
  graphiql: true

server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  undertow:
    threads:
      worker: 64
      io: 4

spring:
  elasticsearch:
    uris: ${elasticsearch.uris}
    username: ${elasticsearch.username}
    password: ${elasticsearch.password}
    connect-timeout: ${elasticsearch.connect-timeout}
    socket-timeout: ${elasticsearch.socket-timeout}
  graphql:
    graphiql:
      enabled: ${graphql.graphiql}
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 100GB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${keycloak.host}/realms/${keycloak.realm}/protocol/openid-connect/certs
          issuer-uri: ${keycloak.host}/realms/${keycloak.realm}

resilience4j.retry:
  configs:
    default:
      maxAttempts: 3
      waitDuration: 250
      retryExceptions:
        - com.studies.catalog.domain.exceptions.InternalErrorException
        - org.springframework.web.client.ResourceAccessException
        - org.springframework.web.client.HttpServerErrorException.InternalServerError
        - org.springframework.web.client.HttpServerErrorException.GatewayTimeout
        - org.springframework.web.client.HttpServerErrorException.ServiceUnavailable
        - java.net.SocketTimeoutException
        - java.util.concurrent.TimeoutException
        - java.io.IOException
  instances:
    categories:
      baseConfig: default